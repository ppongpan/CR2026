<script>document.documentElement.classList.add('js');
/* look (theme + glow) is applied before first paint so a saved theme never flashes the default; storage may throw */
(function(){try{var v=JSON.parse(localStorage.getItem('xpg6-look')||'null'),r=document.documentElement,c={aurora:'#0a0718',sunset:'#14080e'};if(v&&c[v.t]){r.setAttribute('data-theme',v.t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',c[v.t]);}if(v&&/^(off|max)$/.test(v.g))r.setAttribute('data-glow',v.g);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
/* ============ E. TOKENS ============ */
:root{
  --bg:#050a12; --bg-2:#0a1220; --bg-rgb:5,10,18;
  --srf-rgb:13,21,36; --srf2-rgb:9,15,27;
  --surface:rgba(var(--srf-rgb),.74);
  --surface-strong:rgba(var(--srf2-rgb),.86);
  --surface-inset:rgba(2,6,14,.45);
  --surface-solidish:rgba(var(--srf-rgb),.92);
  --rim:rgba(148,163,184,.16); --hi:rgba(255,255,255,.09); --lo:rgba(0,0,0,.35);
  --ink:#e6edf7; --ink-2:#b6c3d6; --ink-3:#93a4bb;
  --brand:#22d3ee; --brand-rgb:34,211,238; --brand-glow:rgba(var(--brand-rgb),.38); --brand-ink:#04131a; --acc2:#34d399;
  --ev:#34d399; --ev-glow:rgba(52,211,153,.40);
  --food:#fbbf24; --cafe:#fb923c; --sight:#a78bfa; --shop:#f472b6;
  --hotel:#60a5fa; --event:#fb7185;
  --must-a:#fde68a; --must-b:#f59e0b; --must-c:#fb7185; --must-ink:#1a1204;
  --danger:#f87171; --warn:#fbbf24;
  --blur-chrome:14px; --blur-hero:8px; --sat:140%;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
  --sh-card:0 10px 28px -14px rgba(0,0,0,.75);
  --sh-float:0 18px 40px -16px rgba(0,0,0,.8);
  --glow-ev:0 0 0 1px var(--ev-glow),0 0 22px -6px var(--ev-glow);
  --glow-brand:0 0 0 1px var(--brand-glow),0 0 22px -6px var(--brand-glow);
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-1:160ms; --dur-2:260ms; --dur-3:320ms;
  --hdr-h:112px; --nav-h:64px; --tap:44px; --dh-h:64px;
  --fs-2xs:11.5px; --fs-xs:12.5px; --fs-sm:13.5px; --fs-base:15px; --fs-lg:17px; --fs-xl:21px; --fs-num:30px;
  --gutter:max(14px, env(safe-area-inset-left));
  --gutter-r:max(14px, env(safe-area-inset-right));
  --font:'Prompt','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,sans-serif;
  /* theme layer: ambient light + hero glass. Themes (⚙ settings) override only these and the rgb triplets above */
  --hero-a:rgba(14,30,44,.72); --hero-b:rgba(9,15,27,.78);
  --mesh-1:rgba(16,185,129,.16); --mesh-2:rgba(34,211,238,.13); --mesh-3:rgba(20,184,166,.12); --mesh-top:#050a12; --mesh-mid:#07101c;
  --blob-1:rgba(16,185,129,.55); --blob-2:rgba(34,211,238,.5); --blob-3:rgba(20,184,166,.5);
  /* soft halo that replaces box outlines; a box may set its own --halo-rgb */
  --halo-rgb:34,211,238; --halo-a:.2; --halo-r:26px;
}

/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box;caret-color:transparent}
input:not([readonly]):not([disabled]),textarea:not([readonly]):not([disabled]),[contenteditable="true"],[contenteditable=""]{caret-color:var(--brand)}
html{overflow-x:hidden;background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--font);font-size:var(--fs-sm);line-height:1.55;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;position:relative;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button,a,input{touch-action:manipulation}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none !important}
.nb{display:inline-block;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.num,.tnum{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.no-sb{scrollbar-width:none;-ms-overflow-style:none}
.no-sb::-webkit-scrollbar{display:none}

/* ============ GLASS ============ */
.glass-chrome{background:var(--surface-strong);
  -webkit-backdrop-filter:blur(var(--blur-chrome)) saturate(var(--sat));backdrop-filter:blur(var(--blur-chrome)) saturate(var(--sat));
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--rim)}
.glass-hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));
  -webkit-backdrop-filter:blur(var(--blur-hero)) saturate(var(--sat));backdrop-filter:blur(var(--blur-hero)) saturate(var(--sat));
  border:1px solid transparent;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),inset 0 -1px 1px var(--lo),0 0 calc(var(--halo-r) + 10px) -6px rgba(var(--halo-rgb),calc(var(--halo-a) * 1.4)),var(--sh-float)}
.glass-flat,.xc,.panel{background:var(--surface);border:1px solid transparent;
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 1px var(--lo),0 0 var(--halo-r) -6px rgba(var(--halo-rgb),var(--halo-a)),var(--sh-card)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass-chrome{background:rgba(var(--srf2-rgb),.97)}
  .glass-hero{background:rgba(var(--srf-rgb),.95)}
}
@media (prefers-reduced-transparency:reduce){
  :root{--surface:rgba(var(--srf-rgb),.92);--surface-strong:rgba(var(--srf2-rgb),.96)}
  .glass-hero{background:rgba(var(--srf-rgb),.93)}
  .amb-blob{opacity:calc(var(--o,.25) * .6) !important}
}

/* ============ AMBIENT (D1) ============ */
.amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.amb-mesh{position:absolute;inset:0;opacity:.9;background:
  radial-gradient(60% 40% at 12% 8%,var(--mesh-1),transparent 70%),
  radial-gradient(55% 45% at 92% 30%,var(--mesh-2),transparent 70%),
  radial-gradient(70% 50% at 40% 100%,var(--mesh-3),transparent 72%),
  linear-gradient(180deg,var(--mesh-top),var(--mesh-mid) 60%,var(--mesh-top))}
.amb-blob{position:absolute;border-radius:50%;opacity:var(--o,.25);will-change:transform;
  animation:amb-flow var(--dur,34s) ease-in-out var(--delay,0s) infinite}
@keyframes amb-flow{0%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(8vw,-4vh,0) scale(1.12)}66%{transform:translate3d(-6vw,5vh,0) scale(.94)}100%{transform:translate3d(0,0,0) scale(1)}}
.amb-ic{position:absolute;width:var(--s,44px);height:var(--s,44px);opacity:var(--o,.08);fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;
  animation:ic-sway var(--dur,30s) ease-in-out var(--delay,0s) infinite}
@keyframes ic-sway{0%{transform:translate3d(0,0,0) rotate(0)}30%{transform:translate3d(14px,-18px,0) rotate(6deg)}60%{transform:translate3d(-10px,12px,0) rotate(-5deg)}100%{transform:translate3d(0,0,0) rotate(0)}}
html.paused *,html.paused *::before,html.paused *::after{animation-play-state:paused !important}

/* ============ HEADER ============ */
#top-sentinel{position:absolute;top:48px;left:0;width:1px;height:1px;pointer-events:none}
.hdr{position:sticky;top:0;z-index:40;max-width:30rem;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) var(--gutter-r) 10px var(--gutter);
  border-radius:0 0 var(--r-lg) var(--r-lg)}
.hdr-collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows 220ms var(--ease-out),opacity 220ms var(--ease-out)}
.hdr-collapse>div{min-height:0;overflow:hidden}
.hdr.compact .hdr-collapse{grid-template-rows:0fr;opacity:0}
.hdr-chips{display:flex;flex-wrap:nowrap;gap:5px;padding-bottom:6px;overflow-x:auto;scrollbar-width:none}
.hdr-chips::-webkit-scrollbar{display:none}
.hchip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;white-space:nowrap;letter-spacing:-.01em;border-radius:var(--r-pill);font-size:var(--fs-2xs);font-weight:600;line-height:1.4;border:1px solid}
.hchip.ev{color:var(--ev);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.32)}
.hchip.dt{color:#7dd3fc;background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3)}
.hchip.km{color:var(--ink-2);background:rgba(148,163,184,.1);border-color:var(--rim)}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hdr h1{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.hdr h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ev);box-shadow:0 0 10px var(--ev);margin-right:8px;vertical-align:middle}
.search{position:relative}
.search i.fa-magnifying-glass{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px;pointer-events:none}
.search input{width:100%;height:44px;border-radius:var(--r-md);border:1px solid var(--rim);background:rgba(2,6,14,.55);color:var(--ink);
  font:inherit;font-size:16px;padding:0 46px 0 40px;transition:border-color var(--dur-1),box-shadow var(--dur-1)}
.search input::placeholder{color:var(--ink-3);opacity:1}
.search input:focus{border-color:rgba(var(--brand-rgb),.6);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.15)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search .clear{position:absolute;right:0;top:0;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3);font-size:16px}
.ssum{display:flex;gap:6px;overflow-x:auto;padding-top:8px;margin:0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter));padding-left:var(--gutter);padding-right:var(--gutter-r)}
.ssum .lbl{flex:none;align-self:center;font-size:var(--fs-xs);color:var(--ink-3)}
.ssum button{flex:none;min-height:44px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--rim);background:rgba(148,163,184,.08);font-size:var(--fs-xs);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.ssum button b{color:var(--brand);font-weight:700}
.ssum button.zero{opacity:.55}
.ssum button[aria-current="true"]{border-color:rgba(var(--brand-rgb),.55);color:var(--ink)}

/* ============ LAYOUT ============ */
main{max-width:30rem;margin:0 auto;padding:12px var(--gutter-r) 0 var(--gutter)}
.view{display:block}
.view.enter-r{animation:view-in-r var(--dur-2) var(--ease-out)}
.view.enter-l{animation:view-in-l var(--dur-2) var(--ease-out)}
@keyframes view-in-r{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes view-in-l{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.view>*+*{margin-top:12px}
.panel{border-radius:var(--r-lg);padding:14px}
.sec-h h2{font-size:var(--fs-base);font-weight:700;line-height:1.4;display:flex;align-items:center;gap:8px}
.sec-h .sec-d{font-size:var(--fs-xs);color:var(--ink-2);margin-top:2px}
.sec-h+*{margin-top:12px}
.list>*+*{margin-top:10px}

/* reveal (D2) */
html.js .reveal{opacity:0;transform:translateY(10px)}
html.js .reveal.in{opacity:1;transform:none;transition:opacity 420ms var(--ease-out) var(--rd,0ms),transform 420ms var(--ease-out) var(--rd,0ms)}

/* ripple + press (D7) */
[data-ripple]{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.28);pointer-events:none;transform:scale(0);animation:ripple 450ms var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(2.5);opacity:0}}
.press:active,.chip:active,.btn:active,.rs-card:active,.nav-btn:active,.alt:active,.fab:active{transform:scale(.97)}
.press,.chip,.btn,.rs-card,.nav-btn,.alt,.fab{transition:transform var(--dur-1) var(--ease-out),background-color var(--dur-1),border-color var(--dur-1),color var(--dur-1)}

/* ============ HERO ============ */
.hero{border-radius:var(--r-xl);padding:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--brand-rgb),.18),transparent 65%);pointer-events:none}
.hero-eyebrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--ink-2);font-weight:500}
.hero-eyebrow .live{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:var(--r-pill);background:rgba(52,211,153,.14);color:var(--ev);font-weight:600;border:1px solid rgba(52,211,153,.3)}
.hero-big{margin-top:6px;font-size:var(--fs-xl);font-weight:700;line-height:1.35}
.hero-big .num{font-size:var(--fs-num);color:var(--brand);margin:0 2px}
.hero-sub{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.batt{display:flex;align-items:center;gap:4px;margin-top:12px}
.batt-body{flex:1;height:22px;border-radius:7px;border:1.5px solid rgba(52,211,153,.55);padding:2px;position:relative;overflow:hidden;background:rgba(2,6,14,.5)}
.batt-fill{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#10b981,var(--ev));transform-origin:left;transform:scaleX(var(--k,1));position:relative;overflow:hidden}
.batt-fill::after,.g-fill::after,.sb-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 8px,transparent 8px 18px);background-size:36px 100%;opacity:0}
.charging::after{opacity:1 !important;animation:stripes 1.2s linear 3}
@keyframes stripes{from{background-position:0 0}to{background-position:36px 0}}
.batt-cap{width:5px;height:10px;border-radius:0 3px 3px 0;background:rgba(52,211,153,.55)}
.batt-t{font-size:var(--fs-xs);color:var(--ink-2);margin-top:6px}
.hstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hstat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);background:rgba(148,163,184,.08);border:1px solid var(--rim);font-size:var(--fs-xs);color:var(--ink-2)}
.hstat i{color:var(--ev)}
.hstat b{color:var(--ink);font-weight:600}
/* "มีเพลง" badge on the d4 route card */
.rs-music{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 7px;border-radius:var(--r-pill);font-size:11px;font-weight:600;
  color:#1a1204;background:linear-gradient(135deg,#fde68a,#f59e0b)}
.rs-music i{font-size:9px}
.prog{height:8px;border-radius:var(--r-pill);background:rgba(148,163,184,.14);margin-top:12px;overflow:hidden}
.prog span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--acc2));transform-origin:left;transform:scaleX(var(--k,0));transition:transform 900ms var(--ease-out)}
.prog-t{display:flex;justify-content:space-between;font-size:var(--fs-2xs);color:var(--ink-3);margin-top:5px}
.hline{display:flex;gap:10px;align-items:baseline;margin-top:10px;font-size:var(--fs-sm)}
.hline .k{flex:none;min-width:44px;font-size:var(--fs-2xs);font-weight:600;padding:1px 8px;border-radius:var(--r-pill);text-align:center}
.hline .k.now{background:rgba(var(--brand-rgb),.16);color:var(--brand)}
.hline .k.next{background:rgba(148,163,184,.14);color:var(--ink-2)}
.hline .v{min-width:0;color:var(--ink)}
.hline .v .num{font-weight:700;color:var(--brand);margin-right:4px}
.btn-hero{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin-top:14px;border-radius:var(--r-md);
  background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:var(--fs-base);box-shadow:0 10px 26px -10px var(--brand-glow)}
.btn-hero .s{font-weight:500;font-size:var(--fs-xs);opacity:.85}

/* ============ ROUTE STRIP ============ */
.strip-h{display:flex;align-items:center;gap:8px;padding:0 2px}
.strip-h b{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:700;color:var(--ink)}
.strip-h b i{color:var(--must-a);text-shadow:0 0 10px rgba(253,230,138,.7)}
.strip-h small{margin-left:auto;font-size:var(--fs-2xs);color:var(--ink-3);white-space:nowrap}
/* padded top/bottom so the cards' glow is not clipped by the scroller; negative margins give the space back */
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-6px calc(-1 * var(--gutter-r)) -12px calc(-1 * var(--gutter));padding:14px var(--gutter-r) 20px var(--gutter);scroll-padding:0 var(--gutter)}
.rs-card{--acc:var(--brand-rgb);position:relative;flex:none;width:164px;min-height:136px;scroll-snap-align:start;border-radius:var(--r-lg);padding:11px 12px;display:flex;flex-direction:column;gap:5px;text-align:left;
  background:linear-gradient(155deg,rgba(var(--acc),.17),rgba(var(--acc),.04) 55%,transparent),var(--surface);border:1px solid transparent;
  box-shadow:inset 0 1px 0 var(--hi),0 0 var(--halo-r) -8px rgba(var(--acc),calc(var(--halo-a) * 2)),var(--sh-card)}
.rs-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:0 0 34px -4px rgba(var(--acc),.6),inset 0 0 24px rgba(var(--acc),.2),inset 0 1px 0 rgba(255,255,255,.18);transition:opacity var(--dur-2) var(--ease-out)}
.rs-card.active{background:linear-gradient(155deg,rgba(var(--acc),.32),rgba(var(--acc),.09) 60%,transparent),var(--surface)}
.rs-card.active::after{opacity:1;animation:rs-breathe 3.6s ease-in-out infinite}
/* the Loy Krathong day always glows warm so it is easy to find, brightest when chosen */
.rs-card.rs-loy{background:radial-gradient(120% 80% at 85% 0%,rgba(255,190,90,.3),transparent 60%),linear-gradient(160deg,rgba(110,52,12,.62),rgba(36,18,10,.7) 65%),var(--surface)}
.rs-card.rs-loy::after{opacity:.5;animation:rs-breathe-soft 3.6s ease-in-out infinite}
.rs-card.rs-loy.active::after{opacity:1;animation-name:rs-breathe}
@keyframes rs-breathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes rs-breathe-soft{0%,100%{opacity:.3}50%{opacity:.75}}
.rs-day{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:var(--fs-xs);font-weight:700;color:var(--ink)}
.rs-day .today{font-size:10.5px;font-weight:600;padding:0 6px;border-radius:var(--r-pill);background:rgba(var(--brand-rgb),.18);color:var(--brand)}
.rs-hl{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:700;color:var(--ink);line-height:1.3}
.rs-hl i{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:13px;color:#170c03;
  background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(var(--acc),1) 45%);box-shadow:0 0 16px -2px rgba(var(--acc),.75)}
.rs-loy .rs-hl,.rs-loy .rs-day{color:#ffe9c2}
.rs-hl>span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rs-route{font-size:var(--fs-2xs);color:var(--ink-3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.rs-stats .bolt{color:var(--ev)}
.rs-night{font-size:var(--fs-2xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-night i{color:var(--hotel);margin-right:4px}

/* ============ CHIPS / PILLS ============ */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter));padding:0 var(--gutter-r) 2px var(--gutter)}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-xs);font-weight:500;
  color:var(--ink-2);background:rgba(var(--srf-rgb),.6);border:1px solid var(--rim);white-space:nowrap}
.chip i{font-size:12px}
.chip[aria-pressed="true"]{color:var(--brand-ink);background:var(--brand);border-color:var(--brand);font-weight:600}
.chip[aria-pressed="true"] i{color:inherit !important}
.chip.c-ev[aria-pressed="true"]{background:var(--ev);border-color:var(--ev);color:#03140d}
.chip.c-food[aria-pressed="true"]{background:var(--food);border-color:var(--food);color:#1a1204}
.chip.c-hl{color:var(--must-a);border-color:rgba(253,230,138,.35)}
.chip.c-hl[aria-pressed="true"]{background:linear-gradient(135deg,var(--must-a),var(--must-b));color:var(--must-ink);border-color:transparent}
.chip.c-tool{color:var(--ink-2);border-style:dashed}
.chip.c-tool[aria-pressed="true"]{background:rgba(var(--brand-rgb),.14);color:var(--brand);border-style:solid;border-color:rgba(var(--brand-rgb),.5)}

/* ============ TIMELINE ============ */
.tl-day+.tl-day{margin-top:18px}
.day-head{position:sticky;top:calc(var(--hdr-h) - 1px);z-index:20;display:flex;align-items:stretch;gap:8px;padding:10px 4px 12px;margin:0 -4px;
  background:linear-gradient(180deg,rgba(var(--bg-rgb),.98) 0%,rgba(var(--bg-rgb),.96) 86%,rgba(var(--bg-rgb),0) 100%)}
.dh-date{flex:none;max-width:42%;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;border-radius:var(--r-md);background:rgba(var(--srf-rgb),.9);border:1px solid var(--rim)}
.dh-date b{font-size:var(--fs-xs);font-weight:700;color:var(--ink);line-height:1.35}
.dh-date span{font-size:var(--fs-2xs);color:var(--ink-3);line-height:1.35;white-space:nowrap}
.dh-date span i{color:var(--ev)}
.dh-hl{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--must-a),var(--must-b) 60%,#f97316);color:var(--must-ink);text-align:left;box-shadow:0 8px 20px -12px rgba(245,158,11,.7)}
.dh-hl .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(26,18,4,.14);font-size:13px}
.dh-hl .tx{min-width:0;flex:1;line-height:1.3}
.dh-hl .k{display:block;font-size:10.5px;font-weight:600;opacity:.8}
.dh-hl b{display:block;font-size:var(--fs-xs);font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dh-hl .go{flex:none;font-size:11px;opacity:.7}
.dh-sub{padding:2px 0 10px}
.dh-route{font-size:var(--fs-xs);color:var(--ink-2)}
.dh-route i{color:var(--brand);margin-right:6px}
.dh-subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.subhl{min-height:44px;display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 6px;border-radius:var(--r-pill);font-size:var(--fs-xs);color:var(--ink);
  background:rgba(253,230,138,.08);border:1px solid rgba(253,230,138,.26);max-width:100%;text-align:left}
.subhl i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--must-a);background:rgba(253,230,138,.12)}
.subhl span{min-width:0}
.tl-list{position:relative;padding-left:40px}
.tl-list::before{content:"";position:absolute;left:14px;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--brand),var(--acc2));opacity:.55}
.tl-item{position:relative;scroll-margin-top:calc(var(--hdr-h) + var(--dh-h) + 12px)}
.tl-item+.tl-item{margin-top:10px}
.node{position:absolute;left:-40px;top:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;z-index:1;font-size:12px;
  background:var(--bg-2);border:1.5px solid var(--c,var(--brand));color:var(--c,var(--brand));box-shadow:0 0 0 4px var(--bg)}
.node.n-must{background:linear-gradient(135deg,var(--must-a),var(--must-b));border-color:transparent;color:var(--must-ink);box-shadow:0 0 0 4px var(--bg),0 0 0 7px rgba(245,158,11,.2),0 0 18px rgba(245,158,11,.45)}
.node.n-event{background:var(--event);border-color:transparent;color:#2a0710;box-shadow:0 0 0 4px var(--bg),0 0 16px rgba(251,113,133,.55)}
.is-now .node::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--brand);animation:pulse 1.8s var(--ease-out) infinite}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.8);opacity:0}}
.is-now .node{border-color:var(--brand);color:var(--brand)}
html.mode-during .is-past{opacity:.55}
.st-tag{display:none;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:var(--r-pill);line-height:1.6}
.is-now .st-tag{display:inline-block;background:var(--brand);color:var(--brand-ink)}
.is-next .st-tag{display:inline-block;background:rgba(148,163,184,.18);color:var(--ink)}
.is-now .xc{box-shadow:inset 0 0 22px rgba(var(--brand-rgb),.14),inset 0 1px 0 var(--hi),0 0 32px -4px rgba(var(--brand-rgb),.55),var(--sh-card)}

/* ============ EXPANDABLE CARD (B) ============ */
.xc{position:relative;border-radius:var(--r-lg);scroll-margin-top:calc(var(--hdr-h) + 12px)}
.xc-head{display:block;width:100%;text-align:left;padding:11px 40px 11px 14px;min-height:60px;border-radius:inherit;color:inherit}
.xc-head>span{display:block}
.chev{position:absolute;right:12px;top:14px;width:22px;height:22px;display:grid;place-items:center;font-size:12px;color:var(--ink-3);transition:transform var(--dur-3) var(--ease-out)}
.xc.open .chev{transform:rotate(180deg);color:var(--brand)}
.h-top{display:flex !important;flex-wrap:wrap;align-items:center;gap:4px 6px;min-height:22px}
.h-badges{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.t-start{font-size:var(--fs-base);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.t-end{font-size:var(--fs-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.h-title{font-size:var(--fs-base);font-weight:600;line-height:1.42;margin-top:2px;color:var(--ink);display:-webkit-box !important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xc.open .h-title{-webkit-line-clamp:unset;display:block !important}
.h-meta{font-size:var(--fs-xs);color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.h-meta .sep{color:var(--ink-3);margin:0 5px}
.h-meta .star{color:var(--food)}
.xc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-3) var(--ease-out)}
.xc.open .xc-body{grid-template-rows:1fr}
.xc-inner{min-height:0;overflow:hidden;opacity:0;transform:translateY(-4px);transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out)}
.xc.open .xc-inner{opacity:1;transform:none;transition-delay:60ms}
.xc-pad{padding:0 14px 14px}
.xc-pad>*+*{margin-top:10px}

/* highlight levels (C1) */
.xc.hl-must{background:linear-gradient(150deg,rgba(253,230,138,.14),rgba(245,158,11,.05) 40%,transparent 70%),var(--surface-solidish);
  box-shadow:inset 0 1px 0 rgba(253,230,138,.24),0 0 calc(var(--halo-r) + 6px) -6px rgba(245,158,11,calc(var(--halo-a) * 2.4)),var(--sh-card)}
.xc.hl-top{box-shadow:inset 0 1px 0 var(--hi),0 0 var(--halo-r) -6px rgba(var(--brand-rgb),calc(var(--halo-a) * 1.8)),var(--sh-card)}
.xc.hl-event{box-shadow:inset 3px 0 0 var(--event),0 0 calc(var(--halo-r) + 6px) -6px rgba(251,113,133,calc(var(--halo-a) * 2.4)),var(--sh-card)}
.xc.ev-glow{box-shadow:inset 0 1px 0 var(--hi),0 0 var(--halo-r) -6px rgba(52,211,153,calc(var(--halo-a) * 2.2)),var(--sh-card)}
.shim{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.shim::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(105deg,transparent,rgba(253,230,138,.22) 45%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%)}
.in .shim::after,.shim.go::after{animation:shimmer 1.1s var(--ease-out) 1 forwards}
@keyframes shimmer{to{transform:translateX(220%)}}

/* badges / small chips */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:var(--r-pill);font-size:10px;font-weight:700;line-height:1.6;white-space:nowrap;border:1px solid transparent}
.bdg i{font-size:9.5px}
.bdg.b-must{background:linear-gradient(135deg,var(--must-a),var(--must-b));color:var(--must-ink)}
.bdg.b-top{background:rgba(var(--brand-rgb),.12);color:var(--brand);border-color:rgba(var(--brand-rgb),.35)}
.bdg.b-event{background:var(--event);color:#2a0710}
.bdg.b-day{background:rgba(253,230,138,.1);color:var(--must-a);border-color:rgba(253,230,138,.45)}
.bdg.b-main{background:rgba(251,191,36,.14);color:var(--food);border-color:rgba(251,191,36,.35)}
.bdg.b-new{background:rgba(244,114,182,.14);color:#f9a8d4;border-color:rgba(244,114,182,.35)}
.bdg.b-plan{background:rgba(96,165,250,.14);color:#93c5fd;border-color:rgba(96,165,250,.35)}
.bdg.b-evm{background:var(--ev);color:#03140d}
.bdg.b-alt{background:rgba(148,163,184,.14);color:var(--ink-2)}
.bdg.b-match{background:rgba(var(--brand-rgb),.16);color:var(--brand)}
.altc{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;color:var(--ink-2);background:rgba(148,163,184,.1);line-height:1.6}
.altc .d{width:5px;height:5px;border-radius:50%;background:var(--c)}
.pchip{display:inline-block;vertical-align:1px;margin-right:6px;padding:0 7px;border-radius:7px;font-size:11px;font-weight:600;line-height:1.7;white-space:nowrap}
.pchip.pc-ev{background:rgba(52,211,153,.16);color:var(--ev)}
.pchip.pc-cat{background:rgba(148,163,184,.14);color:var(--ink-2)}
.socchip{display:inline-block;padding:0 7px;border-radius:7px;background:rgba(52,211,153,.12);color:var(--ev);font-weight:600;font-variant-numeric:tabular-nums}
.socchip.rem{background:rgba(148,163,184,.12);color:var(--ink-2)}

/* expanded content */
.sub{font-size:var(--fs-sm);color:var(--ink-2)}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-xs);color:var(--ink-2)}
.info i{color:var(--ink-3);margin-right:5px}
.info .star{color:var(--food)}
.details{font-size:var(--fs-sm);color:var(--ink-2);background:var(--surface-inset);border:1px solid rgba(148,163,184,.1);border-radius:var(--r-md);padding:10px 12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:600;text-align:center}
.btn-primary{flex:1 1 100%;min-height:48px;background:var(--brand);color:var(--brand-ink);font-weight:700;box-shadow:0 8px 22px -12px var(--brand-glow)}
.btn-ev{flex:1 1 100%;min-height:48px;background:var(--ev);color:#03140d;font-weight:700}
.btn-food{flex:1 1 100%;min-height:48px;background:var(--food);color:#1a1204;font-weight:700}
.btn-ghost{flex:1 1 0;min-width:0;background:rgba(148,163,184,.08);border:1px solid var(--rim);color:var(--ink);font-weight:500;font-size:var(--fs-xs)}
.btn-ghost i{color:var(--brand)}
.btn-hotel{background:rgba(96,165,250,.14);color:#bfdbfe;border:1px solid rgba(96,165,250,.35)}
.hint{display:flex;gap:8px;font-size:var(--fs-xs);color:#c4b5fd;background:rgba(99,102,241,.1);border:1px solid rgba(129,140,248,.25);border-radius:var(--r-md);padding:8px 10px}
.hint i{margin-top:3px}
.alts-h{font-size:var(--fs-xs);font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.alts-h i{color:var(--brand)}
.alt-note-x{font-size:var(--fs-xs);color:var(--must-a);margin-bottom:6px}
.alt-list>li+li{margin-top:6px}
.alt{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 10px;border-radius:var(--r-md);background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.12)}
.alt.match{border-color:rgba(var(--brand-rgb),.75);box-shadow:inset 0 0 0 1px rgba(var(--brand-rgb),.5),inset 0 0 16px rgba(var(--brand-rgb),.14)}
.alt.ahl-must{border-color:rgba(253,230,138,.4)}
.alt-ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.alt-tx{flex:1;min-width:0;display:block}
.alt-n{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--ink);line-height:1.4}
.alt-n .hstar{color:var(--must-b);margin-left:4px;font-size:11px}
.alt-n .hstar.top{color:var(--brand)}
.alt-note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--fs-xs);color:var(--ink-3);line-height:1.45}
.alt-tag{display:inline-block;margin-top:3px;font-size:10.5px;padding:0 7px;border-radius:var(--r-pill);background:rgba(148,163,184,.12);color:var(--ink-2);line-height:1.7}
.alt .ext{flex:none;color:var(--ink-3);font-size:12px}
.foot{font-size:var(--fs-2xs);color:var(--ink-3)}

/* cat colours */
.t-ev{--c:var(--ev)} .t-food{--c:var(--food)} .t-cafe{--c:var(--cafe)} .t-sight{--c:var(--sight)} .t-shop{--c:var(--shop)} .t-hotel{--c:var(--hotel)} .t-event{--c:var(--event)}

/* empty */
.empty{text-align:center;padding:28px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px dashed var(--rim);color:var(--ink-2)}
.empty i.big{font-size:26px;color:var(--ink-3);display:block;margin-bottom:8px}
.empty .btn{margin-top:12px;background:rgba(var(--brand-rgb),.14);color:var(--brand);border:1px solid rgba(var(--brand-rgb),.4)}

/* ============ EV TAB ============ */
.ev-sim{--halo-rgb:52,211,153}
.ev-sim .sec-h h2{color:var(--ev)}
.gauge{display:flex;align-items:center;gap:5px;margin-top:14px}
.g-body{flex:1;height:58px;border-radius:14px;border:2px solid color-mix(in srgb,var(--gc) 60%,transparent);padding:4px;position:relative;background:rgba(2,6,14,.55);overflow:hidden;transition:border-color 250ms}
.g-fill{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--gc) 70%,#000),var(--gc));transform-origin:left;
  transform:scaleX(calc(var(--soc,85) / 100));transition:transform 250ms var(--ease-out),background 250ms;position:relative;overflow:hidden}
.g-fill::after{opacity:.6;animation:stripes 1.2s linear infinite}
.g-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.g-num i{font-size:16px}
.g-cap{width:7px;height:22px;border-radius:0 4px 4px 0;background:color-mix(in srgb,var(--gc) 60%,transparent)}
.gauge.lv-high{--gc:var(--ev)} .gauge.lv-mid{--gc:var(--warn)} .gauge.lv-low{--gc:var(--danger)}
.soc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px;font-size:var(--fs-xs);color:var(--ink-2)}
.soc-row b{color:var(--ev);font-size:var(--fs-sm);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:4px 0 0;cursor:pointer;--p:83%}
.range::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--ev) 0 var(--p),rgba(148,163,184,.2) var(--p) 100%)}
.range::-moz-range-track{height:8px;border-radius:8px;background:rgba(148,163,184,.2)}
.range::-moz-range-progress{height:8px;border-radius:8px;background:var(--ev)}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-10px;background:#e6fff5;border:3px solid var(--ev);box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 0 6px rgba(52,211,153,.15)}
.range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#e6fff5;border:3px solid var(--ev)}
.soc-scale{display:flex;justify-content:space-between;gap:6px;font-size:var(--fs-2xs);color:var(--ink-3)}
.legs-list>li+li{margin-top:8px}
.leg{display:flex;align-items:center;gap:10px}
.leg-n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;color:var(--ev);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3)}
.leg-m{flex:1;min-width:0}
.leg-t{font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-t b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.leg-bar{position:relative;height:8px;margin-top:4px;border-radius:8px;background:rgba(148,163,184,.14);overflow:hidden}
.leg-base{position:absolute;left:0;top:0;bottom:0;width:calc(var(--a) * 100%);background:rgba(148,163,184,.3)}
.leg-fill{position:absolute;top:0;bottom:0;left:calc(var(--a) * 100%);width:calc((var(--b) - var(--a)) * 100%);background:linear-gradient(90deg,#10b981,var(--ev));transform-origin:left;transform:scaleX(0);transition:transform 900ms var(--ease-out) var(--rd,0ms)}
.in .leg-fill,.leg.in .leg-fill{transform:scaleX(1)}
html:not(.js) .leg-fill{transform:none}
.legs-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--rim);font-size:var(--fs-xs);color:var(--ink-2)}
.legs-foot b{color:var(--ev);font-size:var(--fs-sm)}
.ev-label{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:6px;background:rgba(148,163,184,.18);color:var(--ink-2);line-height:1.6}
.ev-label.main{background:var(--ev);color:#03140d}
.ev-soc{font-size:var(--fs-xs);font-weight:600;color:var(--ev);font-variant-numeric:tabular-nums}
.socbar{background:var(--surface-inset);border:1px solid rgba(52,211,153,.18);border-radius:var(--r-md);padding:10px 12px}
.sb-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:var(--fs-xs);color:var(--ink-2)}
.sb-top .live{font-size:20px;font-weight:700;color:var(--ev);font-variant-numeric:tabular-nums}
.sb-top .bolt{color:var(--ev);margin-right:4px}
.sb-top .bolt.pulse{animation:boltp 1.2s ease-in-out 3}
@keyframes boltp{50%{opacity:.35;transform:scale(.85)}}
.sb-track{position:relative;height:12px;border-radius:12px;background:rgba(148,163,184,.14);margin-top:6px;overflow:hidden}
